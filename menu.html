<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Haven & Husk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FDFCF8] text-stone-900">

    <!-- Nav -->
    <nav class="max-w-5xl mx-auto px-8 py-10 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold tracking-tighter italic">Haven & Husk</a>
        <a href="index.html" class="text-sm uppercase tracking-widest hover:text-stone-500 transition">Back to Home</a>
    </nav>

    <!-- Menu Content -->
    <main class="max-w-3xl mx-auto px-8 py-16">
        <h1 class="text-6xl mb-16 text-center">Our Menu</h1>

        <div class="mb-16">
            <h2 class="text-2xl uppercase tracking-widest text-stone-500 mb-8 border-b border-stone-200 pb-2">Coffee</h2>
            <div class="space-y-8">
                <div class="flex justify-between items-baseline">
                    <h3 class="text-xl">Single Origin Pour Over</h3>
                    <span class="font-bold">$8.00</span>
                </div>
                <p class="text-stone-600 text-sm italic">Ethiopian Yirgacheffe, floral notes.</p>
                <div class="flex justify-between items-baseline">
                    <h3 class="text-xl">Artisan Oat Latte</h3>
                    <span class="font-bold">$6.50</span>
                </div>
                <p class="text-stone-600 text-sm italic">House-made oat milk, espresso.</p>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-2xl uppercase tracking-widest text-stone-500 mb-8 border-b border-stone-200 pb-2">Eats</h2>
            <div class="space-y-8">
                <div class="flex justify-between items-baseline">
                    <h3 class="text-xl">Sourdough Avocado Toast</h3>
                    <span class="font-bold">$14.00</span>
                </div>
                <p class="text-stone-600 text-sm italic">Poached egg, chili oil, microgreens.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-3xl mx-auto px-8 py-10 text-center border-t border-stone-200">
        <p class="text-stone-500 text-sm">© 2026 Haven & Husk. All rights reserved.</p>
    </footer>

</body>
</html>
