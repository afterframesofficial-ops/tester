<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Haven & Husk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } h1 { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="bg-[#FDFCF8] text-stone-900 py-20 px-8">
    <main class="max-w-xl mx-auto">
        <a href="index.html" class="text-xs uppercase tracking-widest hover:underline mb-8 block">&larr; Back Home</a>
        <h1 class="text-6xl mb-12 text-center">Reserve Table</h1>
        
        <div class="bg-white p-10 rounded-[2rem] shadow-sm border border-stone-100">
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                
                <input type="hidden" name="access_key" value="PASTE_KUNCI_KAMU_DISINI">
                
                <input type="hidden" name="redirect" value="https://web3forms.com/success">

                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-500 block mb-2">Name</label>
                    <input type="text" name="name" required class="w-full p-4 bg-stone-50 rounded-xl outline-none focus:ring-2 ring-stone-900 border border-stone-100">
                </div>
                
                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-500 block mb-2">Email</label>
                    <input type="email" name="email" required class="w-full p-4 bg-stone-50 rounded-xl outline-none focus:ring-2 ring-stone-900 border border-stone-100">
                </div>
                
                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-500 block mb-2">Reservation Details</label>
                    <textarea name="message" required class="w-full p-4 bg-stone-50 rounded-xl h-32 outline-none focus:ring-2 ring-stone-900 border border-stone-100"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-stone-900 text-white py-4 rounded-xl font-bold hover:bg-stone-700 transition">Send Request</button>
            </form>
        </div>
    </main>
</body>
</html>
